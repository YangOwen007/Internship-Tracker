autoInstallPeers: false
# Security fixes for transitive tools; verify Prisma generation and Next builds
# whenever these overrides are changed.
overrides:
  fast-uri: ^3.1.8
  source-map-js: ^1.2.2
  mysql2: ^3.23.1
  baseline-browser-mapping: ^2.11.0
  deepmerge-ts: ^8.0.0
  'brace-expansion@<2': ^1.1.21
  'brace-expansion@>=4': ^5.0.12
  browserslist: ^4.28.7
  js-yaml: ^4.3.2
  'nanoid@^3': ^3.3.18
  postcss: ^8.5.23
allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: false
  unrs-resolver: false
